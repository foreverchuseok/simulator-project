<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>KoELSA 경기북부지사 | 전기식 엘리베이터 3D 시뮬레이터</title>
  <style>
    /* ==========================================================================
     CSS RESET & BASE STYLES
     ========================================================================== */
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #12171f;
      color: #e2e8f0;
      font-family: 'Malgun Gothic', sans-serif;
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    /* 3D 뷰포트 */
    #canvas-wrap {
      flex: 1;
      position: relative;
      overflow: hidden;
      width: 100%;
    }

    #canvas-wrap canvas {
      display: block;
      width: 100% !important;
      height: 100% !important;
      outline: none;
    }

    /* 힌트 UI */
    .ui-hint {
      position: absolute;
      bottom: 20px;
      left: 20px;
      background-color: rgba(13, 17, 23, 0.88);
      border: 1px solid #21262d;
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 12px;
      color: #8b949e;
      line-height: 1.4;
      pointer-events: none;
      z-index: 80;
    }

    /* ── HUD 컨테이너 — 기본 좌상단, 드래그 이동 가능 ── */
    #hud {
      position: absolute;
      top: 10px;
      left: 10px;
      z-index: 100;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 8px;
    }

    /* 상태 디스플레이 (엘리베이터 인디케이터풍 LCD) — 드래그 핸들 겸용 */
    #statusbar {
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 6px 10px 6px 14px;
      max-width: calc(100vw - 24px);
      background: linear-gradient(180deg, #10161d, #1b232c);
      border: 1px solid rgba(255, 255, 255, 0.5);
      border-radius: 13px;
      box-shadow: 0 8px 20px rgba(31, 41, 55, 0.25), inset 0 0 14px rgba(0, 0, 0, 0.55);
      font-family: Consolas, 'Courier New', monospace;
      font-size: 13.5px;
      font-weight: 700;
      letter-spacing: 0.04em;
      cursor: grab;
      user-select: none;
      touch-action: none;
    }

    #statusbar:active {
      cursor: grabbing;
    }

    /* 접기/펴기 토글 */
    #hud-toggle {
      flex: none;
      width: 24px;
      height: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: none;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.09);
      color: #8b949e;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    #hud-toggle svg {
      width: 14px;
      height: 14px;
      transition: transform 0.2s ease;
    }

    #hud.collapsed #hud-toggle svg {
      transform: rotate(180deg);
    }

    #hud.collapsed #dock {
      display: none;
    }

    .tb-dot {
      flex: none;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #34c759;
      box-shadow: 0 0 8px rgba(52, 199, 89, 0.9);
    }

    #statusbar #v-floor {
      color: #3fb950;
      text-shadow: 0 0 9px rgba(63, 185, 80, 0.7);
    }

    #statusbar #v-spd {
      color: #f0883e;
      text-shadow: 0 0 9px rgba(240, 136, 62, 0.6);
      white-space: nowrap;
    }

    .tb-sep {
      flex: none;
      width: 1px;
      height: 14px;
      background: rgba(255, 255, 255, 0.14);
    }

    #statusbar #v-dir {
      color: #8b949e;
      font-size: 11px;
      font-weight: 600;
      font-family: 'Malgun Gothic', sans-serif;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* ── 가로 아이콘 독 (애플 스타일) — 서브메뉴와 동일 폭 ── */
    #dock {
      display: flex;
      flex-direction: row;
      justify-content: space-between;
      width: 190px;
      padding: 9px 14px;
      background: rgba(255, 255, 255, 0.6);
      backdrop-filter: blur(20px) saturate(180%);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
      border: 1px solid rgba(255, 255, 255, 0.65);
      border-radius: 24px;
      box-shadow: 0 10px 30px rgba(31, 41, 55, 0.18);
    }

    .dock-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      padding: 0;
      border: none;
      background: none;
      cursor: pointer;
      font-family: inherit;
      -webkit-tap-highlight-color: transparent;
    }

    .dock-icon {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.35), 0 3px 9px rgba(31, 41, 55, 0.25);
      transition: transform 0.16s ease;
    }

    .dock-icon svg {
      width: 21px;
      height: 21px;
    }

    .dock-btn:active .dock-icon {
      transform: scale(0.88);
    }

    .dock-btn.active .dock-icon {
      outline: 3px solid rgba(10, 132, 255, 0.5);
      outline-offset: 2px;
    }

    .dock-icon.ic-op {
      background: linear-gradient(180deg, #4da3ff, #0a63e8);
    }

    .dock-icon.ic-cam {
      background: linear-gradient(180deg, #5bd669, #26b33e);
    }

    .dock-icon.ic-inst {
      background: linear-gradient(180deg, #ffb340, #f27d0c);
    }

    .dock-btn > span {
      font-size: 9px;
      font-weight: 600;
      color: #3a3a3c;
      letter-spacing: 0.01em;
    }

    /* ── 독 아래로 펼쳐지는 세로 서브메뉴 (HUD와 함께 이동) ── */
    .dropdown {
      position: absolute;
      top: calc(100% + 8px);
      left: 0;
      z-index: 99;
      width: 56px;
      max-height: calc(100vh - 170px);
      overflow-y: auto;
      background: rgba(255, 255, 255, 0.72);
      backdrop-filter: blur(24px) saturate(180%);
      -webkit-backdrop-filter: blur(24px) saturate(180%);
      border: 1px solid rgba(255, 255, 255, 0.7);
      border-radius: 18px;
      padding: 6px;
      display: flex;
      flex-direction: column;
      gap: 7px;
      box-shadow: 0 16px 44px rgba(31, 41, 55, 0.22);
      opacity: 0;
      transform: translateY(-10px) scale(0.94);
      transform-origin: top left;
      pointer-events: none;
      transition: opacity 0.2s ease, transform 0.22s cubic-bezier(0.34, 1.45, 0.64, 1);
    }

    .dropdown.open {
      opacity: 1;
      transform: translateY(0) scale(1);
      pointer-events: auto;
    }

    .dd-title {
      font-size: 11px;
      font-weight: 700;
      color: #6e6e73;
      letter-spacing: 0.06em;
      margin-top: 2px;
    }

    .dd-title:first-child {
      margin-top: 0;
    }

    .dd-select {
      width: 44px;
      height: 44px;
      background: rgba(120, 120, 128, 0.12);
      color: #1c1c1e;
      border: none;
      border-radius: 12px;
      padding: 0;
      font-size: 14px;
      font-weight: 700;
      font-family: inherit;
      text-align: center;
      text-align-last: center;
      -webkit-appearance: none;
      appearance: none;
    }

    @media (max-width: 430px) {
      #statusbar #v-dir,
      .tb-sep.tb-dir-sep {
        display: none;
      }
    }

    @media (hover: none), (max-width: 700px) {
      .ui-hint {
        display: none;
      }
    }

    /* ── 태블릿·폰 세로: 좌측 세로 HUD + 운행 메뉴는 우측 반대편 ── */
    @media (orientation: portrait) and (max-width: 1100px) {
      #hud {
        top: max(10px, env(safe-area-inset-top));
        left: max(8px, env(safe-area-inset-left));
        gap: 6px;
        max-width: 76px;
      }

      /* 층 · 속도 · 상태 세로 스택 */
      #statusbar {
        flex-direction: column;
        align-items: center;
        gap: 3px;
        padding: 8px 8px 6px;
        width: 68px;
        max-width: 68px;
        border-radius: 16px;
        font-size: 12px;
      }

      #statusbar .tb-sep {
        width: 28px;
        height: 1px;
      }

      #statusbar #v-floor,
      #statusbar #v-spd {
        text-align: center;
        line-height: 1.2;
      }

      #statusbar #v-spd {
        font-size: 10.5px;
      }

      #statusbar #v-dir {
        display: block;
        font-size: 9px;
        max-width: 56px;
        text-align: center;
        white-space: normal;
        line-height: 1.25;
      }

      #hud-toggle {
        margin-top: 2px;
      }

      /* 운행 · 카메라 · 고장 세로 독 */
      #dock {
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
        width: 68px;
        padding: 10px 6px;
        gap: 10px;
        border-radius: 20px;
      }

      .dock-icon {
        width: 44px;
        height: 44px;
        border-radius: 13px;
      }

      .dock-btn > span {
        font-size: 10px;
      }

      /* 서브메뉴 — 화면 반대편(우측) 세로 패널 (3D 가림 최소화) */
      .dropdown {
        position: fixed;
        top: max(10px, env(safe-area-inset-top));
        right: max(8px, env(safe-area-inset-right));
        left: auto;
        width: 56px;
        max-height: calc(100dvh - 20px - env(safe-area-inset-top) - env(safe-area-inset-bottom));
        transform: translateX(12px) scale(0.96);
        transform-origin: top right;
      }

      .dropdown.open {
        transform: translateX(0) scale(1);
      }

      /* 운행 메뉴는 우측에서 세로로 (층·도어·속도) */
      #dd-op {
        width: 56px;
      }
    }

    /* 로딩 화면 */
    #loading {
      position: absolute;
      inset: 0;
      background-color: #0d1117;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      gap: 16px;
      transition: opacity 0.5s ease;
    }

    #loading.hide {
      opacity: 0;
      pointer-events: none;
    }

    .spinner {
      width: 44px;
      height: 44px;
      border: 4px solid #1e3a5f;
      border-top-color: #58a6ff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    /* 공통 버튼·그리드 (iOS 라이트 스타일) */
    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 7px;
    }

    .stack {
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    #dd-cam { width: 132px; }
    #dd-cam .c-btn { width: 100%; flex-shrink: 0; }
    #dd-cam .dd-title { padding: 4px 3px; letter-spacing: 0; }

    .c-btn {
      width: 44px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(120, 120, 128, 0.12);
      border: none;
      color: #1c1c1e;
      border-radius: 12px;
      padding: 0;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      text-align: center;
      font-family: inherit;
      transition: background 0.15s, transform 0.1s;
      -webkit-tap-highlight-color: transparent;
    }

    .c-btn:hover {
      background: rgba(120, 120, 128, 0.22);
    }

    .c-btn:active {
      transform: scale(0.96);
    }

    .c-btn.active {
      background: #0a84ff;
      color: #ffffff;
    }

    .c-btn.green {
      background: #34c759;
      color: #ffffff;
    }

    .c-btn.blue {
      background: #0a84ff;
      color: #ffffff;
    }

    .c-btn.red {
      background: #ff3b30;
      color: #ffffff;
    }

    .c-btn.warn {
      background: #ff9f0a;
      color: #ffffff;
    }

    /* 모드 선택 표시(AUT/INS) — 색상 클래스를 덮지 않도록 링으로만 강조 */
    .c-btn.mode-on {
      box-shadow: 0 0 0 2px #ffffff, 0 0 0 4px #1c1c1e;
    }

    /* 점검 ▲▼ 는 INS 모드에서만 활성 */
    .c-btn:disabled {
      opacity: 0.3;
      cursor: not-allowed;
    }

    .c-btn:disabled:hover {
      background: rgba(120, 120, 128, 0.12);
    }

    .c-btn:disabled:active {
      transform: none;
    }
  </style>
</head>

<body>

  <!-- 3D 캔버스 영역 -->
  <div id="canvas-wrap">

    <!-- HUD: 상태 디스플레이 + 아이콘 독 + 서브메뉴 (기본 좌상단, 드래그 이동·접기 가능) -->
    <div id="hud">

      <!-- 상태 디스플레이 (드래그 핸들) -->
      <div id="statusbar">
        <span class="tb-dot"></span>
        <span id="v-floor">1F</span>
        <span class="tb-sep"></span>
        <span id="v-spd">0 m/min</span>
        <span class="tb-sep tb-dir-sep"></span>
        <span id="v-dir">정지 대기</span>
        <button id="hud-toggle" title="메뉴 접기/펴기" aria-label="메뉴 접기/펴기">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="18 15 12 9 6 15"></polyline>
          </svg>
        </button>
      </div>

      <!-- 가로 아이콘 독 (애플 스타일: 컬러 아이콘 + 작은 한글 라벨) -->
      <nav id="dock">
      <button class="dock-btn" data-menu="dd-op" title="운행 제어" aria-label="운행 메뉴">
        <div class="dock-icon ic-op">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="7 9 12 4 17 9"></polyline>
            <polyline points="7 15 12 20 17 15"></polyline>
          </svg>
        </div>
        <span>운행</span>
      </button>
      <button class="dock-btn" data-menu="dd-cam" title="카메라 뷰" aria-label="카메라 메뉴">
        <div class="dock-icon ic-cam">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M23 7l-7 5 7 5V7z"></path>
            <rect x="1" y="5" width="15" height="14" rx="2" ry="2"></rect>
          </svg>
        </div>
        <span>카메라</span>
      </button>
      <button class="dock-btn" data-menu="dd-inst" title="고장 재현·안전장치 작동" aria-label="고장 메뉴">
        <div class="dock-icon ic-inst">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path>
            <line x1="12" y1="9" x2="12" y2="13"></line>
            <line x1="12" y1="17" x2="12.01" y2="17"></line>
          </svg>
        </div>
        <span>고장</span>
      </button>
    </nav>

    <!-- 드롭다운: 운행 (세로 배열, 아이콘 위주) -->
    <div class="dropdown" id="dd-op">
      <div class="stack">
        <button class="c-btn green" id="btn-open" title="도어 열림">◀▶</button>
        <button class="c-btn blue" id="btn-close" title="도어 닫힘">▶◀</button>
        <button class="c-btn" id="btn-pax" title="탑승자 승·하차" style="font-size:19px;">🧍</button>
      </div>
      <div class="stack" id="fbtns">
        <div class="c-btn" data-f="3">4F</div>
        <div class="c-btn" data-f="2">3F</div>
        <div class="c-btn" data-f="1">2F</div>
        <div class="c-btn active" data-f="0">1F</div>
      </div>
      <button class="c-btn red" id="btn-estop" style="font-size:20px;" title="비상정지">■</button>
      <select id="speed-select" class="dd-select" title="정격 속도">
        <option value="60">60</option>
        <option value="90">90</option>
      </select>
    </div>

    <!-- 드롭다운: 카메라 (세로 일렬) -->
    <div class="dropdown" id="dd-cam">
      <div class="stack">
        <button class="c-btn active" id="c-shaft" aria-pressed="true">전체 운행</button>
        <div class="dd-title">부품 관찰</div>
        <button class="c-btn" id="c-mr" aria-pressed="false">기계실</button>
        <button class="c-btn" id="c-pit" aria-pressed="false">피트</button>
        <button class="c-btn" id="c-car" aria-pressed="false">카 내부</button>
        <button class="c-btn" id="c-car-top" aria-pressed="false">카 상부</button>
        <button class="c-btn" id="c-governor" aria-pressed="false">조속기</button>
        <div class="dd-title">배경</div>
        <button class="c-btn" id="c-background" aria-pressed="false" title="기존 건물과 자연 풍경 표시">주변 풍경</button>
      </div>
    </div>

    <!-- 드롭다운: 고장 (고장 재현·안전장치 작동 — 현장 용어 영문) -->
    <div class="dropdown" id="dd-inst">
      <div class="stack">
        <button class="c-btn blue" id="btn-aut" title="자동운전">AUT</button>
        <button class="c-btn warn" id="btn-ins" title="점검(수동)운전">INS</button>
        <button class="c-btn" id="btn-ins-up" title="점검 상승 (누르는 동안 서행)" disabled>▲</button>
        <button class="c-btn" id="btn-ins-dn" title="점검 하강 (누르는 동안 서행)" disabled>▼</button>
        <button class="c-btn red" title="도어 고장">DR</button>
        <button class="c-btn red" id="btn-overspeed" title="과속(조속기)">OVS</button>
        <button class="c-btn red" title="세이프티 기어">SAF</button>
      </div>
    </div>

    </div><!-- /#hud -->

    <div id="loading">
      <div class="spinner"></div>
      <span style="font-size:14px; color:#58a6ff; font-weight:bold;">
        N21436 시뮬레이터 구축 중...
      </span>
    </div>
    <canvas id="gl"></canvas>
    <div class="ui-hint">
      🖱 <b>좌클릭 드래그:</b> 화면 회전<br>
      🖱 <b>마우스 휠:</b> 확대 / 축소<br>
      🖱 <b>우클릭 드래그:</b> 화면 이동(Pan)
    </div>
  </div>

  <!-- 라이브러리 로드 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/environment.js"></script>
  <script src="js/hall-interlock.js"></script>
  <script src="js/car-panels.js"></script>
  <script src="js/leveling-sensors.js"></script>
  <script src="js/safety-device.js"></script>
  <script src="js/elevator.js"></script>
  <script src="js/ui.js"></script>

  <script>
    // 층수 및 층고 배열 (피트 1.76m, 1층 4.0m, 2층 3.65m, 3층 3.7m)
    const FLOORS = 4;
    const PIT = 1.76;
    const OVERHEAD = 3.7; // 4.77에서 다른 층과 동일하게 3.7로 수정 (시각적 밸런스)
    const Y0 = 0; // 최하단 바닥

    const FLOOR_Y = [
      Y0 + PIT,
      Y0 + PIT + 4.0,
      Y0 + PIT + 4.0 + 3.65,
      Y0 + PIT + 4.0 + 3.65 + 3.7
    ];
    // 전체 승강로 높이
    const TOTAL_H = FLOOR_Y[3] + OVERHEAD;

    /* ── 카 깊이(세로) 확장 앵커 (config.js CAR_DEPTH_SCALE 와 연동) ──
       전면(도어·승장 기준면)은 CAR_FRONT_Z 로 고정하고, 카는 후방(Z-)으로만
       깊어진다. 따라서 카 중심 CAR_CTR_Z 가 뒤로 이동 → 카 가이드레일·랜딩센서·
       카 로프 수직선·주도르래·카 완충기·조속기까지 모두 CAR_CTR_Z 를 추종한다. */
    const CAR_FRONT_Z = CAR_D_BASE / 2;              // 전면 고정 앵커 (=1.0125, 불변)
    const CAR_CTR_Z   = CAR_FRONT_Z - S.CAR_D / 2;   // 카 중심 Z (깊이 확장 시 후방 이동, base 0)

    // 카 후면 위치 (Z축) — 전면 고정 기준으로 산출
    const CAR_BACK_Z = CAR_FRONT_Z - S.CAR_D;        // = CAR_CTR_Z - S.CAR_D/2
    // 균형추 중앙 위치 (카 후면과 승강로 뒷벽 사이)
    const CWT_CENTER_Z = CAR_BACK_Z - 0.20;
    // 승강로 후면 구조(좌측벽·피트·기계실 슬래브) 내측 Z — 균형추 뒤 클리어런스(0.52) 유지
    const SHAFT_BACK_Z = CWT_CENTER_Z - 0.52;        // base -1.7325 = -S.SHAFT_D/2

    /* ── 승장(전면) 문 구역 유격 — 실제 도면 T-223177 구조 반영 (2026-07-13) ──
       카 전면 고정면(CAR_FRONT_Z)에서 승강로 전면벽까지 층층이 구성:
         카문 →[러닝 클리어런스]→ 승장문 →[문 구역]→ 승강로 전면벽(≈200mm)
       카 문턱과 승장 문턱은 SILL_GAP(코드 ≤35mm) 만큼 이격, 삼방틀은 전면벽에 정렬.
       카 깊이 확장(CAR_DEPTH_SCALE)과 무관하게 전면 고정. */
    const CAR_DOOR_T   = 0.04;                          // 카/승장 도어 두께 (elevator.js dt와 일치)
    const DOOR_RUN_GAP = 0.07;                          // 카문 바깥면 ↔ 승장문 러닝 클리어런스 (≤100mm)
    const FRONT_INNER_Z = CAR_FRONT_Z + CAR_DOOR_T + DOOR_RUN_GAP;   // 승장문 안쪽면 (≈1.1225)
    const SILL_GAP     = 0.03;                          // 카 문턱 ↔ 승장 문턱 수평 간극 (코드 ≤35mm)
    // 승장 도어 어셈블리가 원설계(전면+70mm) 대비 앞으로 이동한 양 — 카도어 클러치 동기용
    const HALL_SHIFT   = FRONT_INNER_Z - (CAR_FRONT_Z + 0.07);
    // 승강로 전면벽 내측 Z — 카 전면에서 ~200mm (문 구역 전체 깊이). 전면벽·삼방틀·로비 정렬 기준
    const FRONT_ZONE_D = 0.20;
    const FRONT_WALL_INNER_Z = CAR_FRONT_Z + FRONT_ZONE_D;          // ≈1.2125
    const HALL_SILL_SHAFT_Z = FRONT_WALL_INNER_Z - 0.022 - 0.032 / 2 - 0.048; // 승장 실 승강로측 끝, 카 실 간극 공용

    // 우측 카 가이드 레일 중심 X — 조속기/피트 인장추 (레일면에서 벽 쪽으로 동일 이격, 로프 수직 유지)
    const CAR_RAIL_REF_X = S.CAR_BG / 2;
    const GOV_TENS_OFFSET_X = 0.115; // 레일 중심 ~ 외측 인장축 (조속·인장추 동일 축)
    const GOV_TENS_X = CAR_RAIL_REF_X + GOV_TENS_OFFSET_X;
    /* 조속기·피트 인장추 공통 축 Z (카 중심 추종).
       ★오프셋 0.52 = 클램프 오프셋 0.37 + 홈반경 0.15.
       안전기 클램프는 카 중심에서 0.37 뒤(월드 Z = CAR_CTR_Z - 0.37)에 고정되어 있고,
       조속기 로프 두 가닥은 이 축의 Z ± 0.15 에 걸린다. 축을 클램프보다 0.15 더 뒤에 두어
       **클램프가 앞쪽(+Z) 가닥을 물게** 한 것 — 권상 로프도 주도르래 앞쪽 가닥이 카측이므로
       조속기가 주도르래와 같은 방향으로 돈다 (ui.js spinSheaves 부호 규칙 참조).
       이 값을 바꾸면 클램프가 무는 가닥이 바뀌어 조속기 회전 방향이 뒤집힌다. */
    /* 안전기 로프 클램프가 로프를 무는 Z (카 중심 기준). 카 상부 크로스헤드
       트립 레버의 후방 크랭크가 이 평면 위에서만 돌기 때문에 단일 원본으로 둔다.
       (js/elevator.js §4-B 후방 크랭크, refreshGovernorRope) */
    const GOV_CLAMP_Z = CAR_CTR_Z - 0.37;
    const GOV_TENS_Z = GOV_CLAMP_Z - 0.15;

    /* ══════════════════════════════════════════════════════════════════════
       종단 안전장치 · 이동케이블 공용 계약 — MR_설계.pdf 137~138p, 부품설계.pdf 184~204p
       승강로측(레일 고정 리미트 스위치 6개·해치 행거)은 environment.js 가,
       카측(스타일 캠 판·카 행거)은 elevator.js 가 만든다.
       두 파일이 같은 수치를 각자 하드코딩하지 않도록 원본은 여기 한 곳뿐이다.
       상세 설명은 docs/TRAVEL-CABLE-TERMINAL.md.

       기계실형 배치: 이동케이블은 제어반 방향인 좌측(-X)으로 배치한다.
       조속기·파이널 리미트·강제감속 위치는 유지하고 케이블 Z 레인을 분리한다.
       ══════════════════════════════════════════════════════════════════════ */
    const CAR_RAIL_X = S.CAR_BG / 2;          // 카 가이드레일 중심 X (±)
    const CAR_RAIL_Z = CAR_CTR_Z + 0.04;      // 카 가이드레일 배면 중심 Z (buildGuideRails 원본)
    /* 좌측 카 레일 브라켓 취부 높이 (현장 2.7m 피치). buildGuideRails 가 배치하고,
       buildLimitSwitches 는 캠·자석판 암이 이 단과 겹치지 않도록 피해 간다. */
    const RAIL_BRACKET_Y = [1.35, 4.05, 6.75, 9.45, 12.15, 14.85];
    const RAIL_BRACKET_BAND = 0.13;           // 브라켓 1단이 차지하는 Y 반높이 + 암 여유

    /* ── 16.8 CAM ASSY / FLS ASSY (MR_설계.pdf 137~138p, 책 135~136p) — 좌측(-X) 레일, 스위치 방식 ──
       2026-09-17 구형 배치: 캠은 카 스타일에 붙는 공용 긴 캠 1본이고,
       리미트 스위치 6개는 레일 클립으로 승강로에 고정한다(environment.js buildLimitSwitches).
       피트부터 순서: 하부 파이널(DFL) → 하부 리미트(DLS) → 하부 강제감속(DSD)
                      … 상부 강제감속(USD) → 상부 리미트(ULS) → 상부 파이널(UFL).
       레버는 XY 평면에서 돌고(피벗축 = Z), 롤러가 카 캠에 −X 로 눌리며 열린다.
       하강 시 캠 하단이, 상승 시 캠 상단이 먼저 스위치를 밟는다. */
    const FLS_Z          = CAR_RAIL_Z - 0.34;      // 캠·스위치 공용 Z 레인 (레일 후면측)
    const FLS_LEVER_L    = 0.050;                  // 고정축~롤러축 48~52mm (부품설계 194p) 중앙값
    const FLS_ROLLER_R   = 0.019;                  // 구형 금속 레버의 고무 롤러
    const FLS_TRIP_ANGLE = 60 * Math.PI / 180;     // 동작각 50~70° (부품설계 197p) 중앙값
    const FLS_LEAD       = 0.060;                  // 캠 양단 절곡(리드인) 길이
    const FLS_PIVOT_X    = -(CAR_RAIL_X - 0.020);  // 레버 고정축 X (레일 배면에서 20mm 카 쪽)
    // 캠 면 X — 동작각에서 역산. 롤러가 완전히 눌렸을 때 롤러의 카 쪽 면 = 캠 면
    const FLS_CAM_FACE_X = FLS_PIVOT_X + FLS_LEVER_L * Math.cos(FLS_TRIP_ANGLE) + FLS_ROLLER_R;
    // 트립 거리 — 종단 착상면(카 바닥 레벨) 기준
    const LS_TRIP        = 0.100;   // 구형 일렬 배치: 모델 리드인 시작점 (실제 설치 규격 아님)
    const FLS_OVERTRAVEL = 0.280;   // 본체 간 180mm; 350mm 점검 오버런 안에서 완전 눌림
    const SLD_DIST       = 1.50;    // 강제감속: 60m/min 1500mm (부품설계 200~201p)
    /* 공용 캠 1본. 스위치 높이 차이로 감속 → 리미트 → 파이널을 순차 작동한다.
       CAM_VANES는 기존 조회부 호환용이며 세 키 모두 같은 원본을 참조한다. */
    const CAM_MID_LY     = (S.CAR_H / 2 + 0.30 + (-S.CAR_H / 2 - 0.05)) / 2;
    const CAM_VANE_W     = 0.028;   // 가닥 타격면 Z 폭
    const FLS_PAIR_DZ    = 0;       // 구형: 여섯 롤러가 동일 수직선, 공용 캠 한 개
    const TERMINAL_CAM = Object.freeze({kind: 'shared', botLY: CAM_MID_LY - 1.28, topLY: CAM_MID_LY + 1.28, dz: 0});
    const CAM_VANES = {
      final: TERMINAL_CAM, limit: TERMINAL_CAM, slowdown: TERMINAL_CAM
    };
    /* 스위치 롤러축 Y. 하부 3개는 자기 가닥 하단이, 상부 3개는 상단이 트립점을 지날 때 밟는다.
       감속 가닥이 1.5m+오버런보다 길어 종단 착상까지 눌린 채 유지된다. */
    const TERMINAL_SWITCHES = (() => {
      const lo = FLOOR_Y[0] + S.CAR_H / 2, up = FLOOR_Y[FLOORS - 1] + S.CAR_H / 2;
      const v = CAM_VANES;
      return [
        { name: 'DFL', label: '하부 파이널 리미트', kind: 'final',    dir: -1, dz: v.final.dz,    y: lo - FLS_OVERTRAVEL + v.final.botLY },
        { name: 'DLS', label: '하부 리미트',         kind: 'limit',    dir: -1, dz: v.limit.dz,    y: lo - LS_TRIP        + v.limit.botLY },
        { name: 'DSD', label: '하부 강제감속',       kind: 'slowdown', dir: -1, dz: v.slowdown.dz, y: lo + SLD_DIST       + v.slowdown.botLY },
        { name: 'USD', label: '상부 강제감속',       kind: 'slowdown', dir: +1, dz: v.slowdown.dz, y: up - SLD_DIST       + v.slowdown.topLY },
        { name: 'ULS', label: '상부 리미트',         kind: 'limit',    dir: +1, dz: v.limit.dz,    y: up + LS_TRIP        + v.limit.topLY },
        { name: 'UFL', label: '상부 파이널 리미트', kind: 'final',    dir: +1, dz: v.final.dz,    y: up + FLS_OVERTRAVEL + v.final.topLY }
      ];
    })();

    /* ── 20.4 착상장치 차폐판 LCD Vane (MR_설계.pdf 186~187p) — 좌측(-X) 레일 ──
       레일 부착형. GLB 원점은 레일 배면 중심. 아래 수치가 Python/카측 센서 공용 원본.
       층별 중심 Y는 착상 시 카 톱빔 월드 높이와 같다
       (`FLOOR_Y[f] + S.CAR_H/2 + LCD_VANE_TOP_BEAM_LY`). 카측 3단 센서 중심도 같은 높이다. */
    // 현장 사진 20260911: 평판 + 카측 3단 포크 센서. Python도 이 수치들을 읽는다.
    const LCD_VANE_H = 0.164;
    const LCD_VANE_W = 0.130;
    const LCD_VANE_T = 0.002;
    const LCD_VANE_OFFSET_Z = 0.350;
    const LCD_VANE_Z = CAR_RAIL_Z + LCD_VANE_OFFSET_Z; // 검출축 Z
    const LCD_VANE_X_OFFSET = 0.036;
    const LCD_SENSOR_PITCH = 0.080;
    const LCD_SLOT_GAP = 0.012;
    const LCD_VANE_TOP_BEAM_LY = S.CAR_H / 2 + 0.36; // elevator.js chY (카 그룹 로컬)

    /* ── 16.2~16.4 이동케이블 T-Cable (184~188p) — 좌측(-X) 제어반 방향 ──
       해치 케이블 행거(고정) ↔ 카 케이블 행거(세이프티 디바이스) 사이에서
       U 자 곡면을 그리며 늘어진다. 총 길이는 "최하층에서 곡면 최하단 = 피트 바닥
       +300mm" 조건으로 buildTravelCable() 이 역산한다. */
    const TC_X          = -(CAR_RAIL_X + 0.1475);      // 케이블 주행 X (좌측)
    const TC_LOOP_R     = 0.120;                    // U 곡면 반지름
    const TC_CAR_Z      = CAR_RAIL_Z + 0.65;       // 센서 및 레일 취부 암보다 전면으로 분리
    const TC_FIX_Z      = TC_CAR_Z + 2 * TC_LOOP_R; // 승강로 고정측 가닥 Z
    const TC_PIT_CLEAR  = 0.30;                     // 최하층 곡면 최하단 ↔ 피트 바닥 300±50mm (188p)
    const TC_HANGER_UP  = 1.00;                     // 해치 행거 = B 지점 카 바닥 +1,000mm (187p)
    const TC_W          = 0.075;                    // 편평형 이동케이블 폭
    const TC_T          = 0.008;                    // 편평형 이동케이블 두께
    const TC_CAR_HANGER_LY = -(S.CAR_H / 2) - 0.2725; // 카 케이블 행거 로컬 Y (세이프티 플랭크 하부)
    const TC_WALL_X = -(S.SHAFT_W / 2) + 0.060; // 외피 끝과 벽 사이 22.5mm
    const TC_SIDE_X = -(S.CAR_W / 2) - 0.050; // 외피 끝과 카 외판 사이 12.5mm
    const TC_CAR_TOP_LY = S.CAR_H / 2 + 0.36 + 0.07 + 0.10; // 카 천장 고정 브라켓 로컬 Y

    /* ── 16.3 / 16.5 / 16.6 승강로 하네스 (185p, 189~192p) — 좌측 벽면 ──
       승강로를 두르는 벽은 좌측벽 하나뿐이라 제어반·새들 고정선은 모두 좌측이다. */
    const HARNESS_X = -(S.SHAFT_W / 2) + 0.065; // 벽 내면에서 65mm (새들 고정)
    const HARNESS_Z = 1.10;                     // 승장 출입구 쪽 모서리 (피트 사다리 Z 회피)
    const PIT_REMOTE_Y = FLOOR_Y[0] + 1.00;     // 요청 기준: 최하층 승강장 +1m
    const TOP_LIGHT_SWITCH_Y = FLOOR_Y[FLOORS - 1] + 1.00;
    const SHAFT_SWITCH_Z = FRONT_WALL_INNER_Z - 0.40 - 0.36; // 사다리 옆, 상하 동일 위치
    const SHAFT_LIGHT_Z = CAR_RAIL_Z - 0.95; // 레일 브라켓 뒤 벽면
    const TC_COLOR = 0x45494d; // 회색 PVC 외피, 현재 장면 광량에서 회색으로 보이도록 조정
    /* 기계실 케이블 관통구 X — 제어반 캐비닛(폭 0.3 × scale 1.5) 바깥이라야 인출이 보인다.
       T 케이블 고정단도 천장을 타고 여기로 모여 제어반으로 들어간다(187p 1항). */
    const MR_CABLE_HOLE_X = (-(S.SHAFT_W / 2) + 0.15) + 0.15 * 1.5 + 0.14;
    const SHAFT_CEIL_Y = Y0 + TOTAL_H - 0.245;  // 승강로 천장 슬래브 하면
    const CEIL_RUN_Y   = SHAFT_CEIL_Y - 0.10;   // 천장 밑 수평 배선 높이

    // ---- [추가] 인디케이터 관리를 위한 배열 ----
    let indicators = [];

    /* ==========================================================================
       2. 상태 변수 및 Three.js 핵심 객체
       ========================================================================== */
    let curFloor = 0, moving = false, doorOpen = false, estop = false, autoTimer = null;
    const ELEVATOR_STATE = { IDLE: 'IDLE', MOVING: 'MOVING', DOOR_OPENING: 'DOOR_OPENING', DOOR_OPEN: 'DOOR_OPEN', DOOR_CLOSING: 'DOOR_CLOSING', ESTOP: 'ESTOP' };
    let currentState = ELEVATOR_STATE.IDLE;
    let targetSpeed = 60;

    let scene, camera, renderer, controls, clock;
    let carGrp, cwtGrp, railGrp, mrGrp, wallGrp, bufferGrp, pitGrp, passengerGrp = null;
    let carDoorL, carDoorR, hatchDoors = [], ropeObjs = [];
    // 회전 시브 4종 — 전부 회전축이 월드 +X. 자전은 ui.js spinSheaves()가 카 실이동량으로 구동한다.
    let mainSheaveGrp = null, deflectorSheaveGrp = null, governorWheelGrp = null, tensionSheaveGrp = null;
    let govRopeLine = null, govRopeData = null;
    let govRopeSegs = null, govRopeGeom = null; // 조속기 실사 와이어로프 (카 연동측 2구간 · 공유 지오메트리)
    const DEBUG_SENSOR = true;
    const USE_PHOTO_BG_PREVIEW = false; // true: koelsa/koelsa2 좌우 원경(흐림) / false: 3D 배경
    const landingDevices = [];
    // 종단 안전장치·이동케이블 (부품설계.pdf 16.2~16.8) 그룹과 가동부 핸들
    let limitGrp = null, shaftCableGrp = null, travelCableGrp = null;
    const terminalDevices = { cam: null, switches: [] };
    const travelCable = { ready: false }; // buildTravelCable() 이 채운다 (refreshTravelCable 계약)
    const carSensors = {};
    const elevatorState = { direction: 0, speed: 0, slowdownActive: false, limitActive: false, finalLimitActive: false };

    function createBox(w, h, d, mat, px = 0, py = 0, pz = 0, parent = scene) {
      const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
      mesh.position.set(px, py, pz); mesh.castShadow = true; mesh.receiveShadow = true;
      parent.add(mesh); return mesh;
    }
    function createCylinder(rt, rb, h, mat, px = 0, py = 0, pz = 0, parent = scene) {
      const mesh = new THREE.Mesh(new THREE.CylinderGeometry(rt, rb, h, 20), mat);
      mesh.position.set(px, py, pz); mesh.castShadow = true; mesh.receiveShadow = true;
      parent.add(mesh); return mesh;
    }
    /* 실사 와이어로프 지오메트리 — 6연선 단면이 길이를 따라 회전한다.
       ★단위 높이(1.0m)로 1개만 만들어 공유하고 mesh.scale.y로 늘려 쓴다.
       카가 움직일 때 길이만 바뀌므로 렌더 루프에서 지오메트리를 만들지 않는다(AGENTS.md).
       피치 56mm(Ø8mm×7) → 1m당 약 18회전. 예전 turns=100 은 노끈처럼 보였다. */
    const GOV_ROPE_D = 0.008;                 // 과속조절기 로프 8파이
    const GOV_ROPE_PITCH = 0.056;             // 꼬임 피치 ≈ 7×지름
    function makeRopeGeometry(radius, pitch = GOV_ROPE_PITCH, heightSeg = 80, radialSeg = 24) {
      const turns = 1 / pitch;
      const g = new THREE.CylinderGeometry(radius, radius, 1, radialSeg, heightSeg, true);
      const pos = g.attributes.position;
      for (let i = 0; i < pos.count; i++) {
        const x = pos.getX(i), y = pos.getY(i), z = pos.getZ(i);
        const lobe = 1 + 0.20 * Math.cos(6 * (Math.atan2(z, x) - turns * Math.PI * 2 * y));
        pos.setXYZ(i, x * lobe, y, z * lobe);
      }
      pos.needsUpdate = true;
      g.computeVertexNormals();
      return g;
    }
    const _govRopeMats = [];
    let _govRopeMap = null, _govRopeNrm = null;
    function _prepRopeTex(tex) {
      tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
      tex.anisotropy = 8;
      tex.repeat.set(1, 1);
      return tex;
    }
    function _bindGovRopeTex() {
      _govRopeMats.forEach(m => {
        if (_govRopeMap) {
          m.map = _govRopeMap.clone();
          m.map.needsUpdate = true;
          m.color.setHex(0xffffff);
        }
        if (_govRopeNrm) {
          m.normalMap = _govRopeNrm.clone();
          m.normalScale.set(1.35, 1.35);
          m.normalMap.needsUpdate = true;
        }
        const len = m.userData.ropeLen;
        if (len) {
          const n = Math.max(0.4, len / GOV_ROPE_PITCH);
          if (m.userData.ropeUvAlongU) {
            if (m.map) m.map.repeat.set(n, 1);
            if (m.normalMap) m.normalMap.repeat.set(n, 1);
          } else {
            if (m.map) m.map.repeat.set(1, n);
            if (m.normalMap) m.normalMap.repeat.set(1, n);
          }
        }
        m.needsUpdate = true;
      });
    }
    (function loadGovRopeTex() {
      const loader = new THREE.TextureLoader();
      loader.load('assets/bg/wire_rope_8mm.png', (tex) => {
        tex.encoding = THREE.sRGBEncoding;
        _govRopeMap = _prepRopeTex(tex);
        _bindGovRopeTex();
      });
      loader.load('assets/bg/wire_rope_8mm_n.png', (tex) => {
        _govRopeNrm = _prepRopeTex(tex);
        _bindGovRopeTex();
      });
    })();
    function makeGovRopeMat() {
      const mat = new THREE.MeshStandardMaterial({
        color: 0xb4bcc4, metalness: 0.78, roughness: 0.36
      });
      _govRopeMats.push(mat);
      if (_govRopeMap) { mat.map = _govRopeMap.clone(); mat.color.setHex(0xffffff); }
      if (_govRopeNrm) { mat.normalMap = _govRopeNrm.clone(); mat.normalScale.set(1.35, 1.35); }
      return mat;
    }
    function setGovRopeLen(mesh, len) {
      mesh.scale.y = len;
      const mat = mesh.material;
      mat.userData.ropeLen = len;
      const n = Math.max(0.4, len / GOV_ROPE_PITCH);
      if (mat.map) mat.map.repeat.set(1, n);
      if (mat.normalMap) mat.normalMap.repeat.set(1, n);
    }

    /* ==========================================================================
       4. 시스템 빌드
       ========================================================================== */
    function init() {
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x7ec8f0); // 시안 하늘 (buildBackground에서 그라데이션으로 교체)
      scene.fog = new THREE.FogExp2(0xe8f4fc, 0.0045);

      const wrap = document.getElementById('canvas-wrap');
      camera = new THREE.PerspectiveCamera(50, wrap.clientWidth / wrap.clientHeight, 0.1, 200);
      camera.position.set(18, Y0 + TOTAL_H * 0.4, 21);

      renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('gl'), antialias: true });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      renderer.physicallyCorrectLights = false;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.2;
      renderer.setSize(wrap.clientWidth, wrap.clientHeight);

      // ── 환경맵 (금속 반사) — 절차적 스튜디오 그라데이션 → PMREM.
      //    scene.environment 미설정 시 metalness 높은 재질(크롬 조속기 등)이 검게 렌더됨.
      (function setupStudioEnv() {
        const c = document.createElement('canvas'); c.width = 16; c.height = 128;
        const g = c.getContext('2d');
        const grad = g.createLinearGradient(0, 0, 0, 128);
        grad.addColorStop(0.00, '#eaf3ff'); // 상부(천장/하늘) 밝게
        grad.addColorStop(0.45, '#f5f7f9');
        grad.addColorStop(0.55, '#cbd3db');
        grad.addColorStop(1.00, '#2a2f36'); // 하부(바닥) 어둡게
        g.fillStyle = grad; g.fillRect(0, 0, 16, 128);
        const tex = new THREE.CanvasTexture(c);
        tex.mapping = THREE.EquirectangularReflectionMapping;
        const pmrem = new THREE.PMREMGenerator(renderer);
        pmrem.compileEquirectangularShader();
        scene.environment = pmrem.fromEquirectangular(tex).texture;
        tex.dispose(); pmrem.dispose();
      })();

      controls = new THREE.OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true; controls.dampingFactor = 0.07;
      controls.target.set(0, Y0 + TOTAL_H * 0.4, 0);
      controls.maxPolarAngle = Math.PI / 2 + 0.10; // 지평선 살짝 아래까지만 (지면 관통 방지)
      controls.minDistance = 2;
      controls.maxDistance = 90;

      // TEMP DEBUG: ?mrcam 쿼리로 기계실 카메라 (스크린샷 확인용)
      if (location.search.includes('mrcam')) {
        document.getElementById('loading').style.display = 'none';
      }
      if (location.search.includes('doorcam')) controls.minDistance = 0.25; // 근접 프리셋 허용
      if (location.search.includes('doorcam=1')) {
        // 2층 승장도어 헤더 — 승강로 내부 시점 (인터록·행거·연동 로프)
        // 헤더 전폭이 도어 행정(±1.145)에 맞춰 2.82m 이므로 양단 연동 풀리까지 담기게 물러선다
        camera.position.set(1.25, FLOOR_Y[1] + 2.60, -1.05);
        controls.target.set(0, FLOOR_Y[1] + 2.22, 1.05);
        document.getElementById('loading').style.display = 'none';
      } else if (location.search.includes('doorcam=2')) {
        // 카도어 오퍼레이터 — 카 상부 후방 시점 (모터·벨트·노란 풀리)
        camera.position.set(1.3, FLOOR_Y[0] + 3.6, -1.1);
        controls.target.set(0, FLOOR_Y[0] + 2.75, 1.0);
        document.getElementById('loading').style.display = 'none';
      } else if (location.search.includes('doorcam=3')) {
        // 1층 도어 인터록 클로즈업 (카 클러치 맞물림)
        camera.position.set(1.05, FLOOR_Y[0] + 2.75, 0.15);
        controls.target.set(-0.05, FLOOR_Y[0] + 1.98, 1.04);
        document.getElementById('loading').style.display = 'none';
      } else if (location.search.includes('doorcam=4')) {
        // 2층 인터록 초근접 (후크·적층 롤러·접점)
        camera.position.set(0.55, FLOOR_Y[1] + 2.25, 0.30);
        controls.target.set(-0.02, FLOOR_Y[1] + 2.02, 1.05);
        document.getElementById('loading').style.display = 'none';
      } else if (location.search.includes('govcam=2')) {
        // 조속기 후면 근접 뷰 — 진자 뒷면 브라켓·연동 링크 2개(타이바·인장 스프링) 확인용
        controls.minDistance = 0.05;
        camera.position.set(GOV_TENS_X - 0.72, Y0 + TOTAL_H + 0.72, GOV_TENS_Z + 0.30);
        controls.target.set(GOV_TENS_X, Y0 + TOTAL_H + 0.60, GOV_TENS_Z - 0.03);
        document.getElementById('loading').style.display = 'none';
      } else if (location.search.includes('govcam')) {
        // 조속기 정면 근접 뷰 (실사 재현 검증용) — 정면은 +X 방향
        controls.minDistance = 0.05;
        camera.position.set(GOV_TENS_X + 0.60, Y0 + TOTAL_H + 0.80, GOV_TENS_Z + 0.68);
        controls.target.set(GOV_TENS_X, Y0 + TOTAL_H + 0.60, GOV_TENS_Z - 0.03);
        document.getElementById('loading').style.display = 'none';
      } else if (location.search.includes('lcdcam')) {
        // 1층 착상 차폐판 — 좌측 레일 전면 레인
        controls.minDistance = 0.10;
        const vy = FLOOR_Y[0] + S.CAR_H / 2 + LCD_VANE_TOP_BEAM_LY;
        camera.position.set(-CAR_RAIL_X - 0.24, vy + 0.10, LCD_VANE_Z + 0.28);
        controls.target.set(-CAR_RAIL_X + LCD_VANE_X_OFFSET, vy, LCD_VANE_Z);
        document.getElementById('loading').style.display = 'none';
      } else if (location.search.includes('flscam')) {
        // 하부 리미트·파이널 스위치(DLS/DFL) — 피트 레일 + 카 스타일 캠 하단
        controls.minDistance = 0.10;
        const sy = TERMINAL_SWITCHES.find(s => s.name === (location.search.includes('flscam=2')?'ULS':'DLS')).y;
        camera.position.set(FLS_PIVOT_X - 0.32, sy + 0.16, FLS_Z - 0.42);
        controls.target.set(FLS_PIVOT_X + 0.02, sy - 0.02, FLS_Z);
        document.getElementById('loading').style.display = 'none';
      } else if (location.search.includes('sldcam')) {
        // 하부 강제감속 스위치(DSD) — 최하층 바닥 +1.5m 트립
        controls.minDistance = 0.10;
        const sy = TERMINAL_SWITCHES.find(s => s.name === 'DSD').y;
        camera.position.set(FLS_PIVOT_X + 0.80, sy + 0.25, FLS_Z - 0.75);
        controls.target.set(FLS_PIVOT_X + 0.03, sy, FLS_Z);
        document.getElementById('loading').style.display = 'none';
      } else if (location.search.includes('mrcam=4')) {
        // 로프브레이크·현수도르래 근접 뷰
        camera.position.set(2.1, Y0 + TOTAL_H + 1.45, -0.15);
        controls.target.set(0, Y0 + TOTAL_H + 0.85, -0.95);
      } else if (location.search.includes('mrcam=3')) {
        camera.position.set(1.6, Y0 + TOTAL_H + 1.5, 1.2);
        controls.target.set(-0.15, Y0 + TOTAL_H + 0.65, -0.25);
      } else if (location.search.includes('mrcam=2')) {
        camera.position.set(3.0, Y0 + TOTAL_H + 1.3, -0.4);
        controls.target.set(0, Y0 + TOTAL_H + 0.6, -0.4);
      } else if (location.search.includes('mrcam')) {
        camera.position.set(2.8, Y0 + TOTAL_H + 2.6, 3.0);
        controls.target.set(0, Y0 + TOTAL_H + 0.55, -0.3);
      }

      clock = new THREE.Clock();

      buildLighting();
      buildBackground();
      buildFrontWallAndLobby(); // 승장 및 점자블록
      buildGuideRails();        // 레일 (후면 균형추)
      buildShaftLandingDevices(); // 승강로 레일 측 센서 (층 인식용 도킹 센서)
      buildLimitSwitches();       // 좌측 레일 CAM ASSY(파이널 리미트) + SLD 자석판 (16.7~16.8)
      buildLevelingVanes();       // 각 층 착상장치 차폐판 (LCD Vane, 좌측 레일)
      buildMachineRoom();       // 기계실 및 도르래
      buildCarCabin();          // 재공사 스텁 — 원본 js/archive/car.js
      buildPassenger();         // 재공사 스텁 — 탑승자 원본 동일 파일
      buildCarDoors();          // 재공사 스텁 — 원본 js/archive/doors.js
      buildHatchDoors();        // 재공사 스텁 — 헤더·페시아·토가드 포함 원본 동일 파일
      buildShaftCableHarness(); // 도어 접점 검정 배선 · 조명 · 상하 스위치 박스
      buildCounterWeight();     // 후면 균형추
      buildTravelCable();       // 이동케이블(T-Cable) U 곡면 — 카·균형추 위치에서 길이 역산 (16.4)
      buildWireRopes();         // 로프
      buildPitFoundation();     // 피트
      updateBuffers();          // 동적 완충기

      // ?tcam(해치 케이블 행거)만 빌드 결과(travelCable.hangerY)가 있어야 잡을 수 있다
      if (travelCable.ready && location.search.includes('tcam') && !location.search.includes('tcam=2')) {
        camera.position.set(TC_X + 1.09, travelCable.hangerY + 0.62, TC_FIX_Z + 0.62);
        controls.target.set(TC_X, travelCable.hangerY - 0.11, (TC_CAR_Z + TC_FIX_Z) / 2 - 0.10);
      }

      bindUIEvents();

      installShadowCache(scene, camera, renderer);

      setTimeout(() => { document.getElementById('loading').classList.add('hide'); renderLoop(); }, 500);
      window.addEventListener('resize', () => {
        camera.aspect = wrap.clientWidth / wrap.clientHeight; camera.updateProjectionMatrix();
        renderer.setSize(wrap.clientWidth, wrap.clientHeight);
      });
    }

    function renderLoop() {
      requestAnimationFrame(renderLoop);
      HallInterlock.updateAll(hatchDoors);
      // 시브 자전은 여기서 시간 기반으로 흉내내지 않는다.
      // 카가 실제로 움직인 만큼만 ui.js spinSheaves(deltaY)가 4개 시브를 돌린다
      // (방향·속도가 로프와 물리적으로 일치하고, 카가 멈추면 시브도 즉시 멈춘다).
      controls.update();
      if (camera.position.y < Y0 + 0.35) camera.position.y = Y0 + 0.35;
      renderer.render(scene, camera);
      if(typeof renderOverspeedInset==='function')renderOverspeedInset();
    }

    init();
  </script>
