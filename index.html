<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>KoELSA 경기북부지사 | 전기식 엘리베이터 3D 시뮬레이터</title>
  <style>
    /* ==========================================================================
     CSS RESET & BASE STYLES
     ========================================================================== */
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #12171f;
      color: #e2e8f0;
      font-family: 'Malgun Gothic', sans-serif;
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    /* 3D 뷰포트 */
    #canvas-wrap {
      flex: 1;
      position: relative;
      overflow: hidden;
      width: 100%;
    }

    #canvas-wrap canvas {
      display: block;
      width: 100% !important;
      height: 100% !important;
      outline: none;
    }

    /* 힌트 UI */
    .ui-hint {
      position: absolute;
      bottom: 20px;
      left: 20px;
      background-color: rgba(13, 17, 23, 0.88);
      border: 1px solid #21262d;
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 12px;
      color: #8b949e;
      line-height: 1.4;
      pointer-events: none;
      z-index: 80;
    }

    /* ── HUD 컨테이너 — 기본 좌상단, 드래그 이동 가능 ── */
    #hud {
      position: absolute;
      top: 10px;
      left: 10px;
      z-index: 100;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 8px;
    }

    /* 상태 디스플레이 (엘리베이터 인디케이터풍 LCD) — 드래그 핸들 겸용 */
    #statusbar {
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 6px 10px 6px 14px;
      max-width: calc(100vw - 24px);
      background: linear-gradient(180deg, #10161d, #1b232c);
      border: 1px solid rgba(255, 255, 255, 0.5);
      border-radius: 13px;
      box-shadow: 0 8px 20px rgba(31, 41, 55, 0.25), inset 0 0 14px rgba(0, 0, 0, 0.55);
      font-family: Consolas, 'Courier New', monospace;
      font-size: 13.5px;
      font-weight: 700;
      letter-spacing: 0.04em;
      cursor: grab;
      user-select: none;
      touch-action: none;
    }

    #statusbar:active {
      cursor: grabbing;
    }

    /* 접기/펴기 토글 */
    #hud-toggle {
      flex: none;
      width: 24px;
      height: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: none;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.09);
      color: #8b949e;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    #hud-toggle svg {
      width: 14px;
      height: 14px;
      transition: transform 0.2s ease;
    }

    #hud.collapsed #hud-toggle svg {
      transform: rotate(180deg);
    }

    #hud.collapsed #dock {
      display: none;
    }

    .tb-dot {
      flex: none;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #34c759;
      box-shadow: 0 0 8px rgba(52, 199, 89, 0.9);
    }

    #statusbar #v-floor {
      color: #3fb950;
      text-shadow: 0 0 9px rgba(63, 185, 80, 0.7);
    }

    #statusbar #v-spd {
      color: #f0883e;
      text-shadow: 0 0 9px rgba(240, 136, 62, 0.6);
      white-space: nowrap;
    }

    .tb-sep {
      flex: none;
      width: 1px;
      height: 14px;
      background: rgba(255, 255, 255, 0.14);
    }

    #statusbar #v-dir {
      color: #8b949e;
      font-size: 11px;
      font-weight: 600;
      font-family: 'Malgun Gothic', sans-serif;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* ── 가로 아이콘 독 (애플 스타일) — 서브메뉴와 동일 폭 ── */
    #dock {
      display: flex;
      flex-direction: row;
      justify-content: space-between;
      width: 190px;
      padding: 9px 14px;
      background: rgba(255, 255, 255, 0.6);
      backdrop-filter: blur(20px) saturate(180%);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
      border: 1px solid rgba(255, 255, 255, 0.65);
      border-radius: 24px;
      box-shadow: 0 10px 30px rgba(31, 41, 55, 0.18);
    }

    .dock-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      padding: 0;
      border: none;
      background: none;
      cursor: pointer;
      font-family: inherit;
      -webkit-tap-highlight-color: transparent;
    }

    .dock-icon {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.35), 0 3px 9px rgba(31, 41, 55, 0.25);
      transition: transform 0.16s ease;
    }

    .dock-icon svg {
      width: 21px;
      height: 21px;
    }

    .dock-btn:active .dock-icon {
      transform: scale(0.88);
    }

    .dock-btn.active .dock-icon {
      outline: 3px solid rgba(10, 132, 255, 0.5);
      outline-offset: 2px;
    }

    .dock-icon.ic-op {
      background: linear-gradient(180deg, #4da3ff, #0a63e8);
    }

    .dock-icon.ic-cam {
      background: linear-gradient(180deg, #5bd669, #26b33e);
    }

    .dock-icon.ic-inst {
      background: linear-gradient(180deg, #ffb340, #f27d0c);
    }

    .dock-btn > span {
      font-size: 9px;
      font-weight: 600;
      color: #3a3a3c;
      letter-spacing: 0.01em;
    }

    /* ── 독 아래로 펼쳐지는 세로 서브메뉴 (HUD와 함께 이동) ── */
    .dropdown {
      position: absolute;
      top: calc(100% + 8px);
      left: 0;
      z-index: 99;
      width: 56px;
      max-height: calc(100vh - 170px);
      overflow-y: auto;
      background: rgba(255, 255, 255, 0.72);
      backdrop-filter: blur(24px) saturate(180%);
      -webkit-backdrop-filter: blur(24px) saturate(180%);
      border: 1px solid rgba(255, 255, 255, 0.7);
      border-radius: 18px;
      padding: 6px;
      display: flex;
      flex-direction: column;
      gap: 7px;
      box-shadow: 0 16px 44px rgba(31, 41, 55, 0.22);
      opacity: 0;
      transform: translateY(-10px) scale(0.94);
      transform-origin: top left;
      pointer-events: none;
      transition: opacity 0.2s ease, transform 0.22s cubic-bezier(0.34, 1.45, 0.64, 1);
    }

    .dropdown.open {
      opacity: 1;
      transform: translateY(0) scale(1);
      pointer-events: auto;
    }

    .dd-title {
      font-size: 11px;
      font-weight: 700;
      color: #6e6e73;
      letter-spacing: 0.06em;
      margin-top: 2px;
    }

    .dd-title:first-child {
      margin-top: 0;
    }

    .dd-select {
      width: 44px;
      height: 44px;
      background: rgba(120, 120, 128, 0.12);
      color: #1c1c1e;
      border: none;
      border-radius: 12px;
      padding: 0;
      font-size: 14px;
      font-weight: 700;
      font-family: inherit;
      text-align: center;
      text-align-last: center;
      -webkit-appearance: none;
      appearance: none;
    }

    @media (max-width: 430px) {
      #statusbar #v-dir,
      .tb-sep.tb-dir-sep {
        display: none;
      }
    }

    @media (hover: none), (max-width: 700px) {
      .ui-hint {
        display: none;
      }
    }

    /* ── 태블릿·폰 세로: 좌측 세로 HUD + 운행 메뉴는 우측 반대편 ── */
    @media (orientation: portrait) and (max-width: 1100px) {
      #hud {
        top: max(10px, env(safe-area-inset-top));
        left: max(8px, env(safe-area-inset-left));
        gap: 6px;
        max-width: 76px;
      }

      /* 층 · 속도 · 상태 세로 스택 */
      #statusbar {
        flex-direction: column;
        align-items: center;
        gap: 3px;
        padding: 8px 8px 6px;
        width: 68px;
        max-width: 68px;
        border-radius: 16px;
        font-size: 12px;
      }

      #statusbar .tb-sep {
        width: 28px;
        height: 1px;
      }

      #statusbar #v-floor,
      #statusbar #v-spd {
        text-align: center;
        line-height: 1.2;
      }

      #statusbar #v-spd {
        font-size: 10.5px;
      }

      #statusbar #v-dir {
        display: block;
        font-size: 9px;
        max-width: 56px;
        text-align: center;
        white-space: normal;
        line-height: 1.25;
      }

      #hud-toggle {
        margin-top: 2px;
      }

      /* 운행 · 카메라 · 고장 세로 독 */
      #dock {
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
        width: 68px;
        padding: 10px 6px;
        gap: 10px;
        border-radius: 20px;
      }

      .dock-icon {
        width: 44px;
        height: 44px;
        border-radius: 13px;
      }

      .dock-btn > span {
        font-size: 10px;
      }

      /* 서브메뉴 — 화면 반대편(우측) 세로 패널 (3D 가림 최소화) */
      .dropdown {
        position: fixed;
        top: max(10px, env(safe-area-inset-top));
        right: max(8px, env(safe-area-inset-right));
        left: auto;
        width: 56px;
        max-height: calc(100dvh - 20px - env(safe-area-inset-top) - env(safe-area-inset-bottom));
        transform: translateX(12px) scale(0.96);
        transform-origin: top right;
      }

      .dropdown.open {
        transform: translateX(0) scale(1);
      }

      /* 운행 메뉴는 우측에서 세로로 (층·도어·속도) */
      #dd-op {
        width: 56px;
      }
    }

    /* 로딩 화면 */
    #loading {
      position: absolute;
      inset: 0;
      background-color: #0d1117;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      gap: 16px;
      transition: opacity 0.5s ease;
    }

    #loading.hide {
      opacity: 0;
      pointer-events: none;
    }

    .spinner {
      width: 44px;
      height: 44px;
      border: 4px solid #1e3a5f;
      border-top-color: #58a6ff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    /* 공통 버튼·그리드 (iOS 라이트 스타일) */
    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 7px;
    }

    .stack {
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .c-btn {
      width: 44px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(120, 120, 128, 0.12);
      border: none;
      color: #1c1c1e;
      border-radius: 12px;
      padding: 0;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      text-align: center;
      font-family: inherit;
      transition: background 0.15s, transform 0.1s;
      -webkit-tap-highlight-color: transparent;
    }

    .c-btn:hover {
      background: rgba(120, 120, 128, 0.22);
    }

    .c-btn:active {
      transform: scale(0.96);
    }

    .c-btn.active {
      background: #0a84ff;
      color: #ffffff;
    }

    .c-btn.green {
      background: #34c759;
      color: #ffffff;
    }

    .c-btn.blue {
      background: #0a84ff;
      color: #ffffff;
    }

    .c-btn.red {
      background: #ff3b30;
      color: #ffffff;
    }

    .c-btn.warn {
      background: #ff9f0a;
      color: #ffffff;
    }
  </style>
</head>

<body>

  <!-- 3D 캔버스 영역 -->
  <div id="canvas-wrap">

    <!-- HUD: 상태 디스플레이 + 아이콘 독 + 서브메뉴 (기본 좌상단, 드래그 이동·접기 가능) -->
    <div id="hud">

      <!-- 상태 디스플레이 (드래그 핸들) -->
      <div id="statusbar">
        <span class="tb-dot"></span>
        <span id="v-floor">1F</span>
        <span class="tb-sep"></span>
        <span id="v-spd">0 m/min</span>
        <span class="tb-sep tb-dir-sep"></span>
        <span id="v-dir">정지 대기</span>
        <button id="hud-toggle" title="메뉴 접기/펴기" aria-label="메뉴 접기/펴기">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="18 15 12 9 6 15"></polyline>
          </svg>
        </button>
      </div>

      <!-- 가로 아이콘 독 (애플 스타일: 컬러 아이콘 + 작은 한글 라벨) -->
      <nav id="dock">
      <button class="dock-btn" data-menu="dd-op" title="운행 제어" aria-label="운행 메뉴">
        <div class="dock-icon ic-op">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="7 9 12 4 17 9"></polyline>
            <polyline points="7 15 12 20 17 15"></polyline>
          </svg>
        </div>
        <span>운행</span>
      </button>
      <button class="dock-btn" data-menu="dd-cam" title="카메라 뷰" aria-label="카메라 메뉴">
        <div class="dock-icon ic-cam">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M23 7l-7 5 7 5V7z"></path>
            <rect x="1" y="5" width="15" height="14" rx="2" ry="2"></rect>
          </svg>
        </div>
        <span>카메라</span>
      </button>
      <button class="dock-btn" data-menu="dd-inst" title="고장 재현·안전장치 작동" aria-label="고장 메뉴">
        <div class="dock-icon ic-inst">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path>
            <line x1="12" y1="9" x2="12" y2="13"></line>
            <line x1="12" y1="17" x2="12.01" y2="17"></line>
          </svg>
        </div>
        <span>고장</span>
      </button>
    </nav>

    <!-- 드롭다운: 운행 (세로 배열, 아이콘 위주) -->
    <div class="dropdown" id="dd-op">
      <div class="stack">
        <button class="c-btn green" id="btn-open" title="도어 열림">◀▶</button>
        <button class="c-btn blue" id="btn-close" title="도어 닫힘">▶◀</button>
      </div>
      <div class="stack" id="fbtns">
        <div class="c-btn" data-f="3">4F</div>
        <div class="c-btn" data-f="2">3F</div>
        <div class="c-btn" data-f="1">2F</div>
        <div class="c-btn active" data-f="0">1F</div>
      </div>
      <button class="c-btn red" id="btn-estop" style="font-size:20px;" title="비상정지">■</button>
      <select id="speed-select" class="dd-select" title="정격 속도">
        <option value="60">60</option>
        <option value="90">90</option>
      </select>
    </div>

    <!-- 드롭다운: 카메라 (세로 일렬) -->
    <div class="dropdown" id="dd-cam">
      <div class="stack">
        <button class="c-btn" id="c-mr" title="기계실">MR</button>
        <button class="c-btn" id="c-pit" title="피트">PIT</button>
        <button class="c-btn" id="c-car" title="카내부">CAR</button>
        <button class="c-btn" id="c-shaft" title="승강로">ALL</button>
      </div>
    </div>

    <!-- 드롭다운: 고장 (고장 재현·안전장치 작동 — 현장 용어 영문) -->
    <div class="dropdown" id="dd-inst">
      <div class="stack">
        <button class="c-btn blue" title="자동운전">AUT</button>
        <button class="c-btn warn" title="수동운전">INS</button>
        <button class="c-btn" title="상승">▲</button>
        <button class="c-btn" title="하강">▼</button>
        <button class="c-btn red" title="도어 고장">DR</button>
        <button class="c-btn red" id="btn-overspeed" title="과속(조속기)">OVS</button>
        <button class="c-btn red" title="세이프티 기어">SAF</button>
      </div>
    </div>

    </div><!-- /#hud -->

    <div id="loading">
      <div class="spinner"></div>
      <span style="font-size:14px; color:#58a6ff; font-weight:bold;">
        N21436 시뮬레이터 구축 중...
      </span>
    </div>
    <canvas id="gl"></canvas>
    <div class="ui-hint">
      🖱 <b>좌클릭 드래그:</b> 화면 회전<br>
      🖱 <b>마우스 휠:</b> 확대 / 축소<br>
      🖱 <b>우클릭 드래그:</b> 화면 이동(Pan)
    </div>
  </div>

  <!-- 라이브러리 로드 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/environment.js"></script>
  <script src="js/elevator.js"></script>
  <script src="js/ui.js"></script>

  <script>
    // 층수 및 층고 배열 (피트 1.76m, 1층 4.0m, 2층 3.65m, 3층 3.7m)
    const FLOORS = 4;
    const PIT = 1.76;
    const OVERHEAD = 3.7; // 4.77에서 다른 층과 동일하게 3.7로 수정 (시각적 밸런스)
    const Y0 = 0; // 최하단 바닥

    const FLOOR_Y = [
      Y0 + PIT,
      Y0 + PIT + 4.0,
      Y0 + PIT + 4.0 + 3.65,
      Y0 + PIT + 4.0 + 3.65 + 3.7
    ];
    // 전체 승강로 높이
    const TOTAL_H = FLOOR_Y[3] + OVERHEAD;

    /* ── 카 깊이(세로) 확장 앵커 (config.js CAR_DEPTH_SCALE 와 연동) ──
       전면(도어·승장 기준면)은 CAR_FRONT_Z 로 고정하고, 카는 후방(Z-)으로만
       깊어진다. 따라서 카 중심 CAR_CTR_Z 가 뒤로 이동 → 카 가이드레일·랜딩센서·
       카 로프 수직선·주도르래·카 완충기·조속기까지 모두 CAR_CTR_Z 를 추종한다. */
    const CAR_FRONT_Z = CAR_D_BASE / 2;              // 전면 고정 앵커 (=1.0125, 불변)
    const CAR_CTR_Z   = CAR_FRONT_Z - S.CAR_D / 2;   // 카 중심 Z (깊이 확장 시 후방 이동, base 0)

    // 카 후면 위치 (Z축) — 전면 고정 기준으로 산출
    const CAR_BACK_Z = CAR_FRONT_Z - S.CAR_D;        // = CAR_CTR_Z - S.CAR_D/2
    // 균형추 중앙 위치 (카 후면과 승강로 뒷벽 사이)
    const CWT_CENTER_Z = CAR_BACK_Z - 0.20;
    // 승강로 후면 구조(좌측벽·피트·기계실 슬래브) 내측 Z — 균형추 뒤 클리어런스(0.52) 유지
    const SHAFT_BACK_Z = CWT_CENTER_Z - 0.52;        // base -1.7325 = -S.SHAFT_D/2

    /* ── 승장(전면) 문 구역 유격 — 실제 도면 T-223177 구조 반영 (2026-07-13) ──
       카 전면 고정면(CAR_FRONT_Z)에서 승강로 전면벽까지 층층이 구성:
         카문 →[러닝 클리어런스]→ 승장문 →[문 구역]→ 승강로 전면벽(≈200mm)
       카 문턱과 승장 문턱은 SILL_GAP(코드 ≤35mm) 만큼 이격, 삼방틀은 전면벽에 정렬.
       카 깊이 확장(CAR_DEPTH_SCALE)과 무관하게 전면 고정. */
    const CAR_DOOR_T   = 0.04;                          // 카/승장 도어 두께 (elevator.js dt와 일치)
    const DOOR_RUN_GAP = 0.07;                          // 카문 바깥면 ↔ 승장문 러닝 클리어런스 (≤100mm)
    const FRONT_INNER_Z = CAR_FRONT_Z + CAR_DOOR_T + DOOR_RUN_GAP;   // 승장문 안쪽면 (≈1.1225)
    const SILL_GAP     = 0.03;                          // 카 문턱 ↔ 승장 문턱 수평 간극 (코드 ≤35mm)
    // 승장 도어 어셈블리가 원설계(전면+70mm) 대비 앞으로 이동한 양 — 카도어 클러치 동기용
    const HALL_SHIFT   = FRONT_INNER_Z - (CAR_FRONT_Z + 0.07);
    // 승강로 전면벽 내측 Z — 카 전면에서 ~200mm (문 구역 전체 깊이). 전면벽·삼방틀·로비 정렬 기준
    const FRONT_ZONE_D = 0.20;
    const FRONT_WALL_INNER_Z = CAR_FRONT_Z + FRONT_ZONE_D;          // ≈1.2125

    // 우측 카 가이드 레일 중심 X — 조속기/피트 인장추 (레일면에서 벽 쪽으로 동일 이격, 로프 수직 유지)
    const CAR_RAIL_REF_X = S.CAR_BG / 2;
    const GOV_TENS_OFFSET_X = 0.115; // 레일 중심 ~ 외측 인장축 (조속·인장추 동일 축)
    const GOV_TENS_X = CAR_RAIL_REF_X + GOV_TENS_OFFSET_X;
    const GOV_TENS_Z = CAR_CTR_Z - 0.22; // 조속기·피트 인장추 공통 Z (카 중심 추종 → 안전기어 클램프 정렬)

    // ---- [추가] 인디케이터 관리를 위한 배열 ----
    let indicators = [];

    /* ==========================================================================
       2. 상태 변수 및 Three.js 핵심 객체
       ========================================================================== */
    let curFloor = 0, moving = false, doorOpen = false, estop = false, autoTimer = null;
    const ELEVATOR_STATE = { IDLE: 'IDLE', MOVING: 'MOVING', DOOR_OPENING: 'DOOR_OPENING', DOOR_OPEN: 'DOOR_OPEN', DOOR_CLOSING: 'DOOR_CLOSING', ESTOP: 'ESTOP' };
    let currentState = ELEVATOR_STATE.IDLE;
    let targetSpeed = 60;

    let scene, camera, renderer, controls, clock;
    let carGrp, cwtGrp, railGrp, mrGrp, wallGrp, bufferGrp, pitGrp;
    let carDoorL, carDoorR, hatchDoors = [], ropeObjs = [];
    let mainSheaveGrp = null, governorWheelGrp = null, tensionSheaveGrp = null, sheaveSpeed = 0;
    let govRopeLine = null, govRopeData = null;
    const DEBUG_SENSOR = true;
    const USE_PHOTO_BG_PREVIEW = false; // true: koelsa/koelsa2 좌우 원경(흐림) / false: 3D 배경
    const landingDevices = [];
    const carSensors = {};
    const elevatorState = { direction: 0, speed: 0, slowdownActive: false, limitActive: false, finalLimitActive: false };

    function createBox(w, h, d, mat, px = 0, py = 0, pz = 0, parent = scene) {
      const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
      mesh.position.set(px, py, pz); mesh.castShadow = true; mesh.receiveShadow = true;
      parent.add(mesh); return mesh;
    }
    function createCylinder(rt, rb, h, mat, px = 0, py = 0, pz = 0, parent = scene) {
      const mesh = new THREE.Mesh(new THREE.CylinderGeometry(rt, rb, h, 20), mat);
      mesh.position.set(px, py, pz); mesh.castShadow = true; mesh.receiveShadow = true;
      parent.add(mesh); return mesh;
    }

    /* ==========================================================================
       4. 시스템 빌드
       ========================================================================== */
    function init() {
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x7ec8f0); // 시안 하늘 (buildBackground에서 그라데이션으로 교체)
      scene.fog = new THREE.FogExp2(0xe8f4fc, 0.0045);

      const wrap = document.getElementById('canvas-wrap');
      camera = new THREE.PerspectiveCamera(50, wrap.clientWidth / wrap.clientHeight, 0.1, 200);
      camera.position.set(18, Y0 + TOTAL_H * 0.4, 21);

      renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('gl'), antialias: true });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      renderer.physicallyCorrectLights = false;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.2;
      renderer.setSize(wrap.clientWidth, wrap.clientHeight);

      controls = new THREE.OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true; controls.dampingFactor = 0.07;
      controls.target.set(0, Y0 + TOTAL_H * 0.4, 0);
      controls.maxPolarAngle = Math.PI / 2 + 0.10; // 지평선 살짝 아래까지만 (지면 관통 방지)
      controls.minDistance = 2;
      controls.maxDistance = 90;

      // TEMP DEBUG: ?mrcam 쿼리로 기계실 카메라 (스크린샷 확인용)
      if (location.search.includes('mrcam')) {
        document.getElementById('loading').style.display = 'none';
      }
      if (location.search.includes('doorcam')) controls.minDistance = 0.25; // 근접 프리셋 허용
      if (location.search.includes('doorcam=1')) {
        // 2층 승장도어 헤더 — 승강로 내부 시점 (인터록·행거·연동 로프)
        camera.position.set(1.05, FLOOR_Y[1] + 2.55, -0.55);
        controls.target.set(0, FLOOR_Y[1] + 2.05, 1.05);
        document.getElementById('loading').style.display = 'none';
      } else if (location.search.includes('doorcam=2')) {
        // 카도어 오퍼레이터 — 카 상부 후방 시점 (모터·벨트·노란 풀리)
        camera.position.set(1.3, FLOOR_Y[0] + 3.6, -1.1);
        controls.target.set(0, FLOOR_Y[0] + 2.75, 1.0);
        document.getElementById('loading').style.display = 'none';
      } else if (location.search.includes('doorcam=3')) {
        // 1층 도어 인터록 클로즈업 (카 클러치 맞물림)
        camera.position.set(1.05, FLOOR_Y[0] + 2.75, 0.15);
        controls.target.set(-0.05, FLOOR_Y[0] + 1.98, 1.04);
        document.getElementById('loading').style.display = 'none';
      } else if (location.search.includes('doorcam=4')) {
        // 2층 인터록 초근접 (후크·적층 롤러·접점)
        camera.position.set(0.55, FLOOR_Y[1] + 2.25, 0.30);
        controls.target.set(-0.02, FLOOR_Y[1] + 2.02, 1.05);
        document.getElementById('loading').style.display = 'none';
      } else if (location.search.includes('mrcam=4')) {
        // 로프브레이크·현수도르래 근접 뷰
        camera.position.set(2.1, Y0 + TOTAL_H + 1.45, -0.15);
        controls.target.set(0, Y0 + TOTAL_H + 0.85, -0.95);
      } else if (location.search.includes('mrcam=3')) {
        camera.position.set(1.6, Y0 + TOTAL_H + 1.5, 1.2);
        controls.target.set(-0.15, Y0 + TOTAL_H + 0.65, -0.25);
      } else if (location.search.includes('mrcam=2')) {
        camera.position.set(3.0, Y0 + TOTAL_H + 1.3, -0.4);
        controls.target.set(0, Y0 + TOTAL_H + 0.6, -0.4);
      } else if (location.search.includes('mrcam')) {
        camera.position.set(2.8, Y0 + TOTAL_H + 2.6, 3.0);
        controls.target.set(0, Y0 + TOTAL_H + 0.55, -0.3);
      }

      clock = new THREE.Clock();

      buildLighting();
      buildBackground();
      buildFrontWallAndLobby(); // 승장 및 점자블록
      buildGuideRails();        // 레일 (후면 균형추)
      buildShaftLandingDevices(); // 승강로 레일 측 센서 (층 인식용 도킹 센서)
      buildLimitSwitches();       // 승강로 좌측 레일 안전용 리미트 스위치
      buildMachineRoom();       // 기계실 및 도르래
      buildCarCabin();          // 엘리베이터 카 내부
      buildCarDoors();          // 유리 타공 카 도어
      buildHatchDoors();        // 승장 도어
      buildCounterWeight();     // 후면 균형추
      buildWireRopes();         // 로프
      buildPitFoundation();     // 피트
      updateBuffers();          // 동적 완충기

      bindUIEvents();

      setTimeout(() => { document.getElementById('loading').classList.add('hide'); renderLoop(); }, 500);
      window.addEventListener('resize', () => {
        camera.aspect = wrap.clientWidth / wrap.clientHeight; camera.updateProjectionMatrix();
        renderer.setSize(wrap.clientWidth, wrap.clientHeight);
      });
    }

    function renderLoop() {
      requestAnimationFrame(renderLoop);
      if (moving) sheaveSpeed = targetSpeed / 30; else { sheaveSpeed *= 0.92; if (sheaveSpeed < 0.001) sheaveSpeed = 0; }
      if (mainSheaveGrp && sheaveSpeed > 0) mainSheaveGrp.rotation.z += sheaveSpeed * clock.getDelta();
      controls.update();
      if (camera.position.y < Y0 + 0.35) camera.position.y = Y0 + 0.35;
      renderer.render(scene, camera);
    }

    init();
  </script>
</body>

</html>
